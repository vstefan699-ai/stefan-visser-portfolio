<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stefan Visser | Junior Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Stefan Visser, junior full-stack developer working with the MERN stack and Django.">

  <!-- Temporary inline styles: this whole file gets replaced when we build the real homepage -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      max-width: 32rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .role {
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .intro {
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #94a3b8;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      background: #38bdf8;
      color: #0f172a;
      border: 2px solid #38bdf8;
    }

    .links a.secondary {
      background: transparent;
      color: #38bdf8;
    }

    .links a:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Stefan Visser</h1>
    <p class="role">Junior Full-Stack Developer · MERN · Django</p>
    <p class="intro">
      My full portfolio is on its way. In the meantime, have a look at my code
      on GitHub or drop me an email.
    </p>
    <div class="links">
      <a href="https://github.com/vstefan699-ai" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="secondary" href="mailto:vstefan699@gmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
